plugins {
    id 'java-library'
    // Adds the Titan dev-session staging tasks (stageTitanDevPlugin,
    // writeTitanDevSession, runViaTitan, runViaTitanDebug, ...) and the
    // post-build hot-reload refresh. See settings.gradle for where this
    // resolves from.
    id 'net.titan.dev' version '0.1.1'
}

group = 'net.titan.plugins'
version = '0.1.0'

def normalizeTitanSdkVersion = { String requested ->
    def value = requested == null ? '' : requested.trim()
    if (value.isEmpty() || value.equalsIgnoreCase('latest')) {
        return 'latest.release'
    }
    return value
}
def isDynamicTitanSdkVersion = { String value ->
    value == 'latest.release' ||
        value == 'latest.integration' ||
        value.contains('+') ||
        value.startsWith('[') ||
        value.startsWith('(')
}
def titanSdkVersion = normalizeTitanSdkVersion(
    providers.gradleProperty('titanSdkVersion').orElse('latest.release').get())
def titanRepositoryUrl = providers.gradleProperty('titanMavenRepositoryUrl')
    .orElse(providers.environmentVariable('TITAN_MAVEN_REPOSITORY_URL'))
    .orElse('https://raw.githubusercontent.com/Soxs/titan-public-sdk/main/maven/releases')

repositories {
    mavenLocal()
    maven {
        name = 'titan'
        url = uri(titanRepositoryUrl.get())
    }
    mavenCentral()
}

configurations.configureEach {
    if (isDynamicTitanSdkVersion(titanSdkVersion)) {
        resolutionStrategy.cacheDynamicVersionsFor 0, 'seconds'
    }
}

dependencies {
    compileOnly "net.titan:titan-plugin-api:${titanSdkVersion}"
    annotationProcessor "net.titan:titan-plugin-api:${titanSdkVersion}"
}

java {
    sourceCompatibility = JavaVersion.VERSION_11
    targetCompatibility = JavaVersion.VERSION_11
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 11
}

tasks.named('jar') {
    archiveFileName = 'prof-amethyst-plugin.jar'
}

// The Titan dev session (gen-N staging, session.json manifest, launch/recycle
// of a dedicated DEV tab, and the post-build hot-reload refresh) is provided by
// the net.titan.dev plugin applied above. The template defaults to the
// TitanLauncher sync repository in gradle.properties (titanClientRoot) and
// resolves state.json to the current synced runtime. Run `gradlew runViaTitan`.
//
// Optional configuration (all values fall back to gradle.properties / env vars):
//
// titanDev {
//     clientRoot = '%USERPROFILE%/.titanclient/repository'
//     sessionSlug = 'titan-java-sample-plugin'
//     javaDebugPort = 5005
// }

sourceSets {
    main {
        java {
            // The template's sample Java plugin would load into the dev tab too.
            exclude '**/sample/**'
        }
    }
}

// JS plugins (js/*.js) don't go through the Java dev-session manifest above -
// TitanClient's DEV tab loads and hot-reload-watches them straight off disk
// from the per-generation dev-session load directory
// (build/.titan/dev/<slug>/load/gen-N/), the same folder the Java plugin JAR
// is staged into. (%USERPROFILE%/.titanclient/plugins, where js/deploy.ps1
// copies to, is only scanned once for manual DEV scans - it is NOT
// hot-reload-watched.)
def devSessionSlug = providers.gradleProperty('titanDevSessionSlug')
    .orElse(providers.environmentVariable('TITAN_DEV_SESSION_SLUG'))
    .orElse(rootProject.name)
    .get()

def jsPluginSources = fileTree('js') {
    include '*.js'
}

def copyJsPluginToGenerations = {
    def loadDir = file("${buildDir}/.titan/dev/${devSessionSlug}/load")
    if (!loadDir.exists()) {
        logger.lifecycle("No Titan dev load directory found at ${loadDir}; skipping JS plugin copy.")
        return
    }

    def copied = 0
    loadDir.eachDirMatch(~/gen-.+/) { generationDir ->
        copy {
            from jsPluginSources
            into generationDir
        }
        copied++
    }

    if (copied == 0) {
        logger.lifecycle("No Titan dev generation folders found under ${loadDir}; skipped JS plugin copy.")
    } else {
        logger.lifecycle("Copied JS plugin(s) to ${copied} Titan dev generation folder(s).")
    }
}

// dependsOn (not finalizedBy) so the copy finishes before the client launches
// and scans gen-N; finalizedBy can let the plugin go missing from the session.
tasks.register('copyJsPluginToTitanDev') {
    dependsOn 'stageTitanDevPlugin'
    inputs.files(jsPluginSources)
    outputs.upToDateWhen { false }
    doLast copyJsPluginToGenerations
}

// `gradlew build` while the dev tab is open pushes JS edits for hot reload.
tasks.named('build') {
    doLast copyJsPluginToGenerations
}

// runViaTitan is an alias for runTitanClient.
tasks.named('runTitanClient') {
    dependsOn 'copyJsPluginToTitanDev'
}

tasks.named('runViaTitanDebug') {
    dependsOn 'copyJsPluginToTitanDev'
}
